name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

jobs:
  # Determine which part of the repo the PR touches. Runs for every PR
  # (both Dependabot and regular) so we can enforce the right CI.
  detect:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      is-frontend: ${{ steps.set.outputs.is-frontend }}
      is-backend: ${{ steps.set.outputs.is-backend }}
    steps:
      - name: Classify pull request scope
        id: set
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # npm updates target /web, gomod updates target /server,
          # github-actions updates target /.github/workflows.
          FRONTEND=false
          BACKEND=false

          # Inspect the files changed by this PR to decide scope.
          FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' || echo "")
          if echo "$FILES" | grep -q '^web/'; then FRONTEND=true; fi
          if echo "$FILES" | grep -q '^server/'; then BACKEND=true; fi

          # Fallback to title heuristic (e.g. "Bump <pkg> in /web").
          if [ "$FRONTEND" = "false" ] && [ "$BACKEND" = "false" ]; then
            case "$PR_TITLE" in
              *"/web"*) FRONTEND=true ;;
              *"/server"*) BACKEND=true ;;
            esac
          fi

          echo "is-frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "is-backend=$BACKEND" >> "$GITHUB_OUTPUT"

  # Frontend changes require the Web CI (build + test) to pass.
  wait-web-ci:
    needs: detect
    if: needs.detect.outputs.is-frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Wait for Web CI to pass
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: 'web-build-and-test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  # Backend changes require the Server CI (build + test) to pass.
  wait-server-ci:
    needs: detect
    if: needs.detect.outputs.is-backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Wait for Server CI to pass
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: 'server-build-and-test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  # Merge gate. This job is the single required status check in branch
  # protection, so it runs for ALL pull requests (Dependabot and regular).
  # It only succeeds after the CI relevant to the PR's scope has passed:
  #   - frontend PR -> waits for Web CI
  #   - backend PR  -> waits for Server CI
  #   - github-actions/other -> no build/test required, passes directly
  check-required:
    needs: [detect, wait-web-ci, wait-server-ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Required checks passed
        run: echo "All required checks for this PR have passed."

  # Auto-merge Dependabot PRs after the relevant checks pass.
  # NOTE: use pull_request.user.login, NOT github.actor, because under
  # pull_request_target github.actor may be a maintainer who re-ran the
  # workflow rather than Dependabot itself.
  auto-merge:
    needs: [detect, wait-web-ci, wait-server-ci]
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'imehc/do-exercise' && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --merge
