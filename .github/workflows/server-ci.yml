name: Server CI

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  server-build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: integration-local-only
          POSTGRES_DB: do_exercise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d do_exercise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      oss:
        image: rustfs/rustfs:1.0.0-rc.1
        env:
          RUSTFS_ACCESS_KEY: tenant-audit-root
          RUSTFS_SECRET_KEY: TenantAuditLocalOnly!123
          RUSTFS_RPC_SECRET: TenantAuditRpcLocalOnly123456789
          RUSTFS_VOLUMES: /data
          RUSTFS_CONSOLE_ENABLE: "false"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://127.0.0.1:9000/health/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 40s

    env:
      OSS_TEST_ENDPOINT: localhost:9000
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: integration-local-only
      POSTGRES_DB: do_exercise_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DATABASE: 15
      RSA_TEST_REQUIRE_REDIS: 1
      BOOTSTRAP_ADMIN_PASSWORD: Integration-Only!123

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'server/go.mod'
        cache: true
      
    - name: Install dependencies
      run: |
        cd server
        go mod download
        go mod verify
      
    - name: Test
      run: |
        cd server
        go test -v ./...
        go test -race -tags integration ./integration -count=1
      
    - name: Build
      run: |
        cd server
        go build -v ./cmd

    - name: OpenAPI drift check
      run: |
        cd server
        # openapicheck 读取 config.yaml；CI 无真实配置，用示例配置占位即可（纯离线，不连库/Redis）
        cp config.example.yaml config.yaml
        go run . openapicheck --config=config.yaml
