name: Server CI

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  server-build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'server/go.mod'
        cache: true
      
    - name: Install dependencies
      run: |
        cd server
        go mod download
        go mod verify
      
    - name: Test
      run: |
        cd server
        go test -v ./...
      
    - name: Build
      run: |
        cd server
        go build -v ./cmd 
