name: Server CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache: true
      
    - name: Install dependencies
      run: |
        cd server
        go mod download
        go mod verify
      
    # - name: Test
    #   run: |
    #     cd server
    #     go test -v ./...
      
    - name: Build
      run: |
        cd server
        go build -v ./cmd 