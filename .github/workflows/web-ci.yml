name: Web CI

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  web-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: |
          cd web
          pnpm install 

      - name: Generate APIs
        run: |
          cd web
          pnpm gen:apis-other

      - name: Compile
        run: |
          cd web
          pnpm compile

      - name: Run tests
        run: |
          cd web
          pnpm test run

      - name: Build
        run: |
          cd web
          pnpm build