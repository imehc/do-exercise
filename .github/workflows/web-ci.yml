name: Web CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' 

      - name: Install dependencies
        run: |
          cd web
          pnpm install 

      - name: Run tests
        run: |
          cd web
          pnpm test run

      - name: Build
        run: |
          cd web
          pnpm build