# 开发环境依赖（数据库 / Redis / 对象存储 RustFS）
# 用法：
#   1. 复制环境变量：cp deploy/docker/.env.dev.example deploy/docker/.env.dev
#   2. 启动依赖：    docker compose -f deploy/docker/docker-compose.dev.yml up -d
#   3. 本地运行后端：cd server && make dev
# 所有端口已映射到宿主机，便于本地进程直接连接（默认端口 5432/6379/9000/9001）。
volumes:
  dev_postgres_data:
    name: dev_postgres_data
  dev_redis_data:
    name: dev_redis_data
  dev_oss_data:
    name: dev_oss_data

services:
  postgres:
    container_name: postgres-dev
    # 必须锁定大版本：PG18 的 PGDATA 是 /var/lib/postgresql/18/docker，
    # 镜像升到 19 后会变成 /19/docker，旧数据仍在卷里但不被识别，
    # postgres 会当空目录重新 initdb —— 表现就是「数据凭空消失」。
    image: postgres:18
    env_file:
      - .env.dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # 挂载点与镜像自身声明的 VOLUME 一致（PG18 起是父目录，不是 /data）
    volumes:
      - dev_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure:3

  redis:
    container_name: redis-dev
    image: redis:8
    env_file:
      - .env.dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure:3

  # 对象存储服务（引擎为 RustFS；入口校验用 RUSTFS_* 环境变量的值来自 .env.dev 的 OSS_* 映射）
  oss:
    container_name: oss-dev
    image: rustfs/rustfs:1.0.0-rc.1
    command: ["/data"]
    ports:
      - "9000:9000" # S3 API（本地服务 / 浏览器预签名访问）
      - "9001:9001" # Web 控制台
    env_file:
      - .env.dev
    environment:
      RUSTFS_ACCESS_KEY: ${OSS_ROOT_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OSS_ROOT_SECRET_KEY}
      RUSTFS_RPC_SECRET: ${OSS_RPC_SECRET}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - dev_oss_data:/data
    security_opt:
      - no-new-privileges:true
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  oss-init:
    container_name: oss-init-dev
    image: rustfs/rc:v0.1.30
    env_file:
      - .env.dev
    environment:
      # 容器内部通过服务名访问对象存储
      OSS_HOST: oss
    depends_on:
      - oss
    entrypoint: ["/bin/sh", "/init-oss.sh"]
    volumes:
      - ./oss/init-oss.sh:/init-oss.sh:ro
    restart: "no"