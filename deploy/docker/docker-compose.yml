volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  minio_data:
    name: minio_data
  server_data:
    name: server_data

services:
  postgres:
    container_name: postgres_data
    # 锁定大版本：PG18 的 PGDATA 为 /var/lib/postgresql/18/docker，
    # 浮动 tag 升到 19 后旧数据不被识别，会重新 initdb 成空库。
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "5432:5432"
    restart: on-failure:3
    networks:
      network:
        ipv4_address: 166.6.0.21
  redis:
    container_name: redis_data
    image: redis:8
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"
    restart: on-failure:3
    networks:
      network:
        ipv4_address: 166.6.0.22
  minio:
    container_name: minio_data
    image: bitnamilegacy/minio:2024.7.4
    ports:
      # - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/bitnami/minio/data
    restart: on-failure:3
    privileged: true
    networks:
      network:
        ipv4_address: 166.6.0.23
  minio-init:
    container_name: minio_init
    # TODO: 建议锁定具体 RELEASE tag（当前 registry 不可达，未能核实可用 tag）。
    # mc 只在 init 阶段跑一次性初始化，不持有数据，浮动 tag 风险低于 postgres/redis。
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    volumes:
      - ./minio/init-minio.sh:/init-minio.sh:ro
    restart: on-failure:3
    networks:
      network:
        ipv4_address: 166.6.0.25
  server:
    container_name: server_data
    volumes:
      - server_data:/app/logs
    build:
      context: ../../server
      dockerfile: ./Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
      MINIO_PRESIGNED_HOST: ${MINIO_PRESIGNED_HOST}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    # ports:
    #   - "6020:6020"
    restart: on-failure:3
    networks:
      network:
        ipv4_address: 166.6.0.24
  web:
    container_name: web
    build:
      context: ../../
      dockerfile: web/Dockerfile
      args:
        OPENAPI_YAML: server/openapi.yaml
    ports:
      - "80:80"
      - "443:443"
      - "9000:9000"
    depends_on:
      - server
    restart: on-failure:3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      network:
        ipv4_address: 166.6.0.26

networks:
  network:
    ipam:
      driver: default
      config:
        - subnet: '166.6.0.0/16'
    
