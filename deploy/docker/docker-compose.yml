volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  oss_data:
    name: oss_data
  server_data:
    name: server_data

services:
  postgres:
    container_name: postgres_data
    # 锁定大版本：PG18 的 PGDATA 为 /var/lib/postgresql/18/docker，
    # 浮动 tag 升到 19 后旧数据不被识别，会重新 initdb 成空库。
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "5432:5432"
    restart: on-failure:3
    networks:
      network:
        ipv4_address: 166.6.0.21
  redis:
    container_name: redis_data
    image: redis:8
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"
    restart: on-failure:3
    networks:
      network:
        ipv4_address: 166.6.0.22
  # 对象存储服务（引擎为 RustFS，仅在此处保留其容器边界环境变量 RUSTFS_*）
  oss:
    container_name: oss_data
    # 必须锁定版本 tag（RC 迭代快、有过策略回归）；rc.1 为 2026-08-08，
    # 升级前到 github.com/rustfs/rustfs/releases 核实；勿用 latest/rc 浮动 tag。
    image: rustfs/rustfs:1.0.0-rc.1
    command: ["/data"] # 镜像入口需要数据目录位置参数
    environment:
      RUSTFS_ACCESS_KEY: ${OSS_ROOT_ACCESS_KEY} # root 凭证（规范名）
      RUSTFS_SECRET_KEY: ${OSS_ROOT_SECRET_KEY}
      RUSTFS_RPC_SECRET: ${OSS_RPC_SECRET} # 推荐显式设置，见迁移文档 R6
      RUSTFS_ADDRESS: ":9000"               # S3 API 监听
      RUSTFS_CONSOLE_ADDRESS: ":9001"       # Console 监听
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - oss_data:/data
    # Console 管理入口（:9001，路径 /rustfs/console，官方不支持子路径反代）。
    # 只绑定宿主机 loopback：本机/SSH 隧道可访问，不暴露到公网（官方建议仅可信网络）。
    # S3 数据面(9000)仍走 nginx 反代（web 容器 9000:9000），不经此映射。
    ports:
      - "127.0.0.1:9001:9001"
    # privileged: true 移除（Bitnami 遗留，RustFS 不需要）
    security_opt:
      - no-new-privileges:true
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      network:
        ipv4_address: 166.6.0.23
  oss-init:
    container_name: oss_init
    image: rustfs/rc:v0.1.30
    environment:
      OSS_ROOT_ACCESS_KEY: ${OSS_ROOT_ACCESS_KEY}
      OSS_ROOT_SECRET_KEY: ${OSS_ROOT_SECRET_KEY}
      OSS_HOST: ${OSS_HOST}
      OSS_PORT: ${OSS_PORT}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_APP_ACCESS_KEY: ${OSS_APP_ACCESS_KEY}
      OSS_APP_SECRET_KEY: ${OSS_APP_SECRET_KEY}
    depends_on:
      - oss
    entrypoint: ["/bin/sh", "/init-oss.sh"]
    volumes:
      - ./oss/init-oss.sh:/init-oss.sh:ro
    restart: on-failure:3
    networks:
      network:
        ipv4_address: 166.6.0.25
  server:
    container_name: server_data
    volumes:
      - server_data:/app/logs
    build:
      context: ../../server
      dockerfile: ./Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      OSS_HOST: ${OSS_HOST}
      OSS_PORT: ${OSS_PORT}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_APP_ACCESS_KEY: ${OSS_APP_ACCESS_KEY}
      OSS_APP_SECRET_KEY: ${OSS_APP_SECRET_KEY}
      OSS_PRESIGNED_HOST: ${OSS_PRESIGNED_HOST}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      oss:
        condition: service_healthy
      oss-init:
        condition: service_completed_successfully
    # ports:
    #   - "6020:6020"
    restart: on-failure:3
    networks:
      network:
        ipv4_address: 166.6.0.24
  web:
    container_name: web
    build:
      context: ../../
      dockerfile: web/Dockerfile
      args:
        OPENAPI_YAML: server/openapi.yaml
    ports:
      - "80:80"
      - "443:443"
      - "9000:9000"
    depends_on:
      - server
    restart: on-failure:3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      network:
        ipv4_address: 166.6.0.26

networks:
  network:
    ipam:
      driver: default
      config:
        - subnet: '166.6.0.0/16'
