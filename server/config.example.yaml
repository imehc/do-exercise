# 授权
auth:
  domain: 127.0.0.1:6020
  access_secret: access_secret
  access_expire_time: 2h
  refresh_secret: refresh_secret
  refresh_expire_time: 7d

# 系统
system:
  host: 127.0.0.1
  port: 6020

# 日志
logger:
  level: "warn"
  directory: "logs"
  max_size: 10240
  max_backups: 30
  max_age: 7
  compress: true

# 数据库
database:
  host: 127.0.0.1
  port: 5432
  database: xxxx-db
  username: xxxx
  password: xxxxxxxx
  pool:
    max_connections: 100
    min_connections: 10
    max_idle_time: 300
    connection_timeout: 5

# redis
redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  database: 0
  pool:
    max_connections: 50
    min_idle_connections: 10
    max_idle_time: 300
  timeout:
    connect: 5
    read: 3
    write: 3

# captcha
captcha:
  key_long: 6
  img_width: 240
  img_height: 80
  captcha_timeout: 60 # open-captcha大于0时才生效

minio:
  host: localhost
  port: 9000
  access_key: xxxxxxxx
  secret_key: xxxxxxxx
  bucket_name: do-exercise
  expires: 3600

# email
email:
  host: smtp.qq.com
  port: 587
  user: xxxxxx@foxmail.com
  pass: xxxxxxxx

# 磁盘路径
disk_list:
  - mount_point: "/"