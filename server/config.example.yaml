# 授权
auth:
  access_expire_time: 2h
  refresh_expire_time: 7d
  login_max_attempts: 5   # 登录失败锁定阈值（0 使用默认 5）
  login_lock_minutes: 5   # 登录失败锁定时长（分钟，0 使用默认 5）

# 系统
system:
  port: 6020

# 日志
logger:
  level: "warn"
  directory: "logs"
  max_size: 10240
  max_backups: 30
  max_age: 7
  compress: true

# 数据库连接信息由环境变量注入，Docker 部署使用 deploy/docker/.env
database:
  pool:
    max_connections: 100
    min_connections: 10
    max_idle_time: 300

# redis
redis:
  host: redis
  port: 6379
  password: ""
  database: 0
  pool:
    max_connections: 50
    min_idle_connections: 10
  timeout:
    connect: 5
    read: 3
    write: 3

# captcha
captcha:
  img_width: 240
  img_height: 80
  captcha_timeout: 60 # open-captcha大于0时才生效

# MinIO 连接信息和访问凭据由环境变量注入，Docker 部署使用 deploy/docker/.env
minio:
  expires: 3600

# email
email:
  host: smtp.qq.com
  port: 587
  user: xxxxxx@foxmail.com
  pass: xxxxxxxx

# 磁盘路径
disk_list:
  - mount_point: "/"
