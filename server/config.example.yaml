# 授权
auth:
  access_expire_time: 2h
  refresh_expire_time: 7d
  login_max_attempts: 5   # 登录失败锁定阈值（0 使用默认 5）
  login_lock_minutes: 5   # 登录失败锁定时长（分钟，0 使用默认 5）

# 系统
system:
  port: 6020
  # 受信任的反向代理网段。留空 = 不信任任何代理（本机直连开发时用）。
  # 部署在 nginx 之后时填其所在网段；docker-compose 默认网段为 166.6.0.0/16。
  # 填错的后果：客户端可伪造 X-Forwarded-For 绕过限流与登录锁定。
  trusted_proxies:
    - '166.6.0.0/16'

# 日志
logger:
  level: "warn"
  directory: "logs"
  max_size: 10240
  max_backups: 30
  max_age: 7
  compress: true

# 数据库连接信息由环境变量注入，Docker 部署使用 deploy/docker/.env
database:
  pool:
    max_connections: 100
    min_connections: 10
    max_idle_time: 300

# redis
redis:
  host: redis
  port: 6379
  password: ""
  database: 0
  pool:
    max_connections: 50
    min_idle_connections: 10
  timeout:
    connect: 5
    read: 3
    write: 3

# captcha
captcha:
  img_width: 240
  img_height: 80
  captcha_timeout: 60 # open-captcha大于0时才生效

# MinIO 连接信息和访问凭据由环境变量注入，Docker 部署使用 deploy/docker/.env
minio:
  expires: 3600

# email
email:
  host: smtp.qq.com
  port: 587
  # 账号与密码请通过环境变量 EMAIL_USER / EMAIL_PASS 注入。
  # 本文件会被 COPY 进镜像层，任何写在这里的凭据都会随镜像分发。
  user: ""
  pass: ""

# 磁盘路径
disk_list:
  - mount_point: "/"
