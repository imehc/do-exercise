# 授权
auth:
  domain: server:6020
  access_secret: access_secret
  access_expire_time: 2h
  refresh_secret: refresh_secret
  refresh_expire_time: 7d

# 系统
system:
  host: server
  port: 6020
  info_interval: 10

# 日志
logger:
  level: "warn"
  directory: "logs"
  max_size: 10240
  max_backups: 30
  max_age: 7
  compress: true

# 数据库连接信息由环境变量注入，Docker 部署使用 deploy/docker/.env
database:
  pool:
    max_connections: 100
    min_connections: 10
    max_idle_time: 300
    connection_timeout: 5

# redis
redis:
  host: redis
  port: 6379
  password: ""
  database: 0
  pool:
    max_connections: 50
    min_idle_connections: 10
    max_idle_time: 300
  timeout:
    connect: 5
    read: 3
    write: 3

# captcha
captcha:
  key_long: 6
  img_width: 240
  img_height: 80
  captcha_timeout: 60 # open-captcha大于0时才生效

# MinIO 连接信息和访问凭据由环境变量注入，Docker 部署使用 deploy/docker/.env
minio:
  expires: 3600

# email
email:
  host: smtp.qq.com
  port: 587
  user: xxxxxx@example.com
  pass: REDACTED-ROTATED-CREDENTIAL

# 磁盘路径
disk_list:
  - mount_point: "/"
