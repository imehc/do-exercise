openapi: 3.1.0
info:
  title: 题库系统
  description: ""
  version: 1.0.0

servers:
  - url: http://127.0.0.1:6020
    description: 开发环境

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token

    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int64
          description: "页码"
        page_size:
          type: integer
          format: int64
          description: "每页数量"
        total:
          type: integer
          format: int64
          description: "总数量"
      required:
        - page
        - page_size
        - total

    Auditor:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: 创建时间
        created_by:
          type: integer
          format: int64
          description: 创建人
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        updated_by:
          type: integer
          format: int64
          description: 更新人
      required:
        - created_at
        - created_by
        - updated_at
        - updated_by

    ID:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID
      required:
        - id

    IDS:
      type: array
      items:
        type: integer
        format: int64

    Status:
      type: integer
      format: int32
      enum:
        - 1
        - 2
      x-enum-descriptions:
        - 启用
        - 禁用
      x-enum-varnames:
        - enabled
        - disabled

    MenuType:
      type: string
      enum:
        - M
        - C
        - F
      x-enum-descriptions:
        - 目录
        - 菜单
        - 按钮
      x-enum-varnames:
        - directory
        - menu
        - button

    Sex:
      type: integer
      format: int32
      enum:
        - 0
        - 1
        - 2
      x-enum-descriptions:
        - 未知
        - 男
        - 女
      x-enum-varnames:
        - unknown
        - male
        - female

    DataScope:
      type: integer
      format: int32
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
      x-enum-descriptions:
        - 全部数据权限
        - 自定数据权限
        - 本部门数据权限
        - 本部门及以下数据权限
        - 仅本人数据权限
      x-enum-varnames:
        - all
        - custom
        - dept
        - deptChild
        - self

    Captcha:
      type: object
      properties:
        captcha_id:
          type: string
          description: 验证码ID
        pic_path:
          type: string
          description: 验证码图片路径
        captcha_length:
          type: string
          description: 验证码长度
      required:
        - captcha_id
        - pic_path
        - captcha_length

    Login:
      type: object
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          description: 密码
        captcha_id:
          type: string
          description: 验证码ID
        captcha:
          type: string
          description: 验证码
      required:
        - username
        - password
        - captcha_id
        - captcha

    ApiCreate:
      type: object
      properties:
        handle:
          type: string
          description: 接口标识
        title:
          type: string
          description: 接口名称
        path:
          type: string
          description: 接口路径
        type:
          type: string
          description: 接口类型
        action:
          type: string
          description: 接口动作
      required:
        - handle
        - title
        - path
        - type
        - action
    ApiUpdate:
      allOf:
        - $ref: "#/components/schemas/ApiCreate"
    Api:
      allOf:
        - $ref: "#/components/schemas/ID"
        - $ref: "#/components/schemas/ApiCreate"
        - $ref: "#/components/schemas/Auditor"

    DictCreate:
      type: object
      properties:
        name:
          type: string
          description: 字典名称
        type:
          type: string
          description: 字典类型
        remark:
          type: string
          description: 字典备注
        status:
          $ref: "#/components/schemas/Status"
        sort:
          type: string
          description: 字典排序
      required:
        - name
        - type
    DictUpdate:
      allOf:
        - $ref: "#/components/schemas/DictCreate"
    Dict:
      allOf:
        - $ref: "#/components/schemas/ID"
        - $ref: "#/components/schemas/DictCreate"
        - $ref: "#/components/schemas/Auditor"
      required:
        - status
        - sort

    DictDataCreate:
      type: object
      properties:
        label:
          type: string
          description: 字典标签
        value:
          type: string
          description: 字典值
        remark:
          type: string
          description: 字典备注
        status:
          $ref: "#/components/schemas/Status"
        sort:
          type: string
          description: 字典排序
      required:
        - label
        - value
    DictDataUpdate:
      type: object
      properties:
        remark:
          type: string
          description: 字典备注
        status:
          $ref: "#/components/schemas/Status"
        sort:
          type: string
          description: 字典排序
    DictData:
      allOf:
        - $ref: "#/components/schemas/ID"
        - $ref: "#/components/schemas/DictDataCreate"
        - $ref: "#/components/schemas/Auditor"
      required:
        - status
        - sort

    DeptCreate:
      type: object
      properties:
        name:
          type: string
          description: 部门名称
        parent_id:
          type: integer
          format: int64
          description: 父级部门ID
        leader:
          type: string
          description: 部门负责人
        phone:
          type: string
          description: 部门电话
        email:
          type: string
          description: 部门邮箱
        post_ids:
          $ref: "#/components/schemas/IDS"
        sort:
          type: string
          description: 部门排序
        status:
          $ref: "#/components/schemas/Status"
      required:
        - name
        - parent_id
        - leader
    DeptUpdate:
      allOf:
        - $ref: "#/components/schemas/DeptCreate"
    Dept:
      allOf:
        - $ref: "#/components/schemas/ID"
        - $ref: "#/components/schemas/DeptCreate"
        - $ref: "#/components/schemas/Auditor"
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
      required:
        - status
        - post_ids
        - posts
    DeptTree:
      allOf:
        - $ref: "#/components/schemas/Dept"
      properties:
        children:
          type: array
          items:
            $ref: "#/components/schemas/DeptTree"
      required:
        - children
        - parent_id
        - status

    Tree:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/Tree"
      required:
        - id
        - label
        - children

    PostCreate:
      type: object
      properties:
        name:
          type: string
          description: 岗位名称
        code:
          type: string
          description: 岗位编码
        remark:
          type: string
          description: 岗位备注
        status:
          $ref: "#/components/schemas/Status"
        sort:
          type: string
          description: 岗位排序
      required:
        - name
        - code
    PostUpdate:
      allOf:
        - $ref: "#/components/schemas/PostCreate"
    Post:
      allOf:
        - $ref: "#/components/schemas/ID"
        - $ref: "#/components/schemas/PostCreate"
        - $ref: "#/components/schemas/Auditor"
      required:
        - status
        - sort

    BaseMenu:
      type: object
      properties:
        title:
          type: string
          description: 菜单标题
        parent_id:
          type: integer
          format: int64
          description: 父级菜单ID
        type:
          $ref: "#/components/schemas/MenuType"
        sort:
          type: string
          description: 菜单排序
      required:
        - title
        - parent_id
        - type
    MenuWithDirectory:
      allOf:
        - $ref: "#/components/schemas/BaseMenu"
      properties:
        name:
          type: string
          description: 路由名称
        icon:
          type: string
          description: 菜单图标
        route:
          type: string
          description: 路由路径
        visible:
          type: boolean
          description: 是否可见
      required:
        - name
        - route
    MenuWithMenu:
      allOf:
        - $ref: "#/components/schemas/MenuWithDirectory"
      properties:
        permission:
          type: string
          description: 权限标识
        api_ids:
          $ref: "#/components/schemas/IDS"
    MenuWithButton:
      allOf:
        - $ref: "#/components/schemas/BaseMenu"
      properties:
        permission:
          type: string
          description: 权限标识
        api_ids:
          $ref: "#/components/schemas/IDS"
    MenuCreate:
      oneOf:
        - $ref: "#/components/schemas/MenuWithDirectory"
        - $ref: "#/components/schemas/MenuWithMenu"
        - $ref: "#/components/schemas/MenuWithButton"
      discriminator:
        propertyName: type
        mapping:
          "M": "#/components/schemas/MenuWithDirectory"
          "C": "#/components/schemas/MenuWithMenu"
          "F": "#/components/schemas/MenuWithButton"
    MenuUpdate:
      oneOf:
        - $ref: "#/components/schemas/MenuWithDirectory"
        - $ref: "#/components/schemas/MenuWithMenu"
        - $ref: "#/components/schemas/MenuWithButton"
      discriminator:
        propertyName: type
        mapping:
          "M": "#/components/schemas/MenuWithDirectory"
          "C": "#/components/schemas/MenuWithMenu"
          "F": "#/components/schemas/MenuWithButton"
    Menu:
      allOf:
        - $ref: "#/components/schemas/ID"
        - $ref: "#/components/schemas/MenuCreate"
        - $ref: "#/components/schemas/Auditor"
      properties:
        apis:
          type: array
          items:
            $ref: "#/components/schemas/Api"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Menu"
      required:
        - children
        - sort
    MenuCompact:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        icon:
          type: string
        route:
          type: string
          description: 路由路径
        children:
          type: array
          items:
            $ref: "#/components/schemas/MenuCompact"
      required:
        - id
        - label
        - route
        - children

    UserBase:
      type: object
      properties:
        avatar:
          type: string
          description: 头像
        nickname:
          type: string
          description: 昵称
        sex:
          $ref: "#/components/schemas/Sex"
          description: 性别
        remark:
          type: string
          description: 备注
        status:
          $ref: "#/components/schemas/Status"
    SysUserBase:
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          description: 密码
        role_id:
          type: integer
          format: int64
          description: 角色ID
        dept_id:
          type: integer
          format: int64
          description: 部门ID
        post_id:
          type: integer
          format: int64
          description: 岗位ID
        email:
          type: string
          description: 邮箱
        phone:
          type: string
          description: 手机号
      required:
        - username
        - password
        - role_id
        - dept_id
        - post_id
    SystemUserCreate:
      allOf:
        - $ref: "#/components/schemas/SysUserBase"
        - $ref: "#/components/schemas/UserBase"
    SystemUserUpdate:
      allOf:
        - $ref: "#/components/schemas/SysUserBase"
        - $ref: "#/components/schemas/UserBase"
    SystemUser:
      allOf:
        - $ref: "#/components/schemas/ID"
        - $ref: "#/components/schemas/SysUserBase"
        - $ref: "#/components/schemas/UserBase"
        - $ref: "#/components/schemas/Auditor"
      properties:
        role:
          $ref: "#/components/schemas/Role"
        dept:
          $ref: "#/components/schemas/Dept"
        post:
          $ref: "#/components/schemas/Post"
      required:
        - role
        - dept
        - post

    RoleCreate:
      type: object
      properties:
        name:
          type: string
          description: 角色名称
        key:
          type: string
          description: 角色权限字符串
        remark:
          type: string
          description: 角色备注
        status:
          $ref: "#/components/schemas/Status"
        sort:
          type: string
          description: 角色排序
      required:
        - name
        - key
    RoleUpdate:
      properties:
        remark:
          type: string
          description: 角色备注
        status:
          $ref: "#/components/schemas/Status"
        sort:
          type: string
          description: 角色排序
    Role:
      allOf:
        - $ref: "#/components/schemas/ID"
        - $ref: "#/components/schemas/RoleCreate"
        - $ref: "#/components/schemas/Auditor"
      properties:
        is_admin:
          type: boolean
          description: 是否为管理员
        data_scope:
          $ref: "#/components/schemas/DataScope"
          description: 数据权限
        menus:
          type: array
          items:
            $ref: "#/components/schemas/Menu"
        apis:
          type: array
          items:
            $ref: "#/components/schemas/Api"
        depts:
          type: array
          items:
            $ref: "#/components/schemas/Dept"
      required:
        - status
        - sort
        - is_admin
        - data_scope
        - menus
        - apis
        - depts
    RoleDataScopeUpdateBase:
      type: object
      properties:
        data_scope:
          $ref: "#/components/schemas/DataScope"
          description: 数据权限
      required:
        - data_scope
    RoleDataScopeUpdateWithDepts:
      allOf:
        - $ref: "#/components/schemas/RoleDataScopeUpdateBase"
        - type: object
          properties:
            dept_ids:
              $ref: "#/components/schemas/IDS"
              description: 部门ID列表
          required:
            - dept_ids
    RoleDataScopeUpdate:
      oneOf:
        - $ref: "#/components/schemas/RoleDataScopeUpdateBase"
        - $ref: "#/components/schemas/RoleDataScopeUpdateWithDepts"
      discriminator:
        propertyName: data_scope
        mapping:
          "1": "#/components/schemas/RoleDataScopeUpdateBase"
          "2": "#/components/schemas/RoleDataScopeUpdateWithDepts"
          "3": "#/components/schemas/RoleDataScopeUpdateBase"
          "4": "#/components/schemas/RoleDataScopeUpdateBase"
          "5": "#/components/schemas/RoleDataScopeUpdateBase"
    RoleMenuUpdate:
      properties:
        menu_ids:
          $ref: "#/components/schemas/IDS"
          description: 菜单ID列表
      required:
        - menu_ids
    RoleApiUpdate:
      properties:
        api_ids:
          $ref: "#/components/schemas/IDS"
          description: 接口ID列表
      required:
        - api_ids
    # 业务
    UserInfoUpdate:
      allOf:
        - $ref: "#/components/schemas/UserBase"
    UserBindEmail:
      properties:
        email:
          type: string
          description: 邮箱
        code:
          type: string
          description: 邮箱验证码
      required:
        - email
        - code
    UserReplaceEmail:
      allOf:
        - $ref: "#/components/schemas/UserBindEmail"
      properties:
        new_email:
          type: string
          description: 新邮箱
      required:
        - new_email
    UserUpdatePassword:
      properties:
        old_password:
          type: string
          description: 旧密码
        new_password:
          type: string
          description: 新密码
      required:
        - old_password
        - new_password
    UserForgetPassword:
      properties:
        email:
          type: string
          description: 邮箱
        code:
          type: string
          description: 邮箱验证码
        password:
          type: string
          description: 新密码
      required:
        - email
        - code
        - password
    User:
      allOf:
        - $ref: "#/components/schemas/ID"
        - $ref: "#/components/schemas/UserBase"
      properties:
        username:
          type: string
          description: 用户名
      required:
        - username

security:
  - bearerAuth: [ ]

tags:
  - name: auth
    description: 认证
  - name: api
    description: 接口管理
  - name: dict
    description: 字典管理
  - name: dict-data
    description: 字典数据管理
  - name: dept
    description: 部门管理
  - name: post
    description: 岗位管理
  - name: menu
    description: 菜单管理
  - name: user
    description: 用户管理
  - name: system-user
    description: 系统用户管理
  - name: role
    description: 角色管理

paths:
  /captcha:
    get:
      summary: 获取验证码
      operationId: getCaptcha
      tags:
        - auth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captcha"
          description: "获取成功"
        "400":
          description: "获取失败"
  /login:
    post:
      summary: 登录
      operationId: login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
          description: "登录成功"
        "400":
          description: "登录失败"
  /refresh_token:
    get:
      summary: 刷新令牌
      operationId: refreshToken
      tags:
        - auth
      parameters:
        - name: refresh_token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
          description: 刷新令牌成功
        "400":
          description: 刷新令牌失败
  /logout:
    get:
      summary: 登出
      operationId: logout
      tags:
        - auth
      responses:
        "204":
          description: "登出成功"
        "400":
          description: "登出失败"
        "401":
          description: "未授权"
      security:
        - bearerAuth: [ ]

  /apis:
    post:
      summary: 创建接口
      operationId: createApi
      tags:
        - api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiCreate"
      responses:
        "201":
          description: "创建成功"
      security:
        - bearer: [ ]
    get:
      summary: 接口列表
      operationId: getApis
      tags:
        - api
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Api"
                  meta:
                    $ref: "#/components/schemas/Pagination"
                required:
                  - data
                  - meta
          description: "获取成功"
      security:
        - bearer: [ ]
  /apis/all:
    get:
      summary: 所有接口
      operationId: getAllApis
      tags:
        - api
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Api"
      security:
        - bearer: [ ]
  /apis/{id}:
    get:
      summary: 获取接口
      operationId: getApi
      tags:
        - api
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Api"
      security:
        - bearer: [ ]
    put:
      summary: 更新接口
      operationId: updateApi
      tags:
        - api
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiUpdate"
      responses:
        "204":
          description: ""
      security:
        - bearer: [ ]
    delete:
      summary: 删除接口
      operationId: deleteApi
      tags:
        - api
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: ""
      security:
        - bearer: [ ]

  /dicts:
    post:
      summary: 创建字典
      operationId: createDict
      tags:
        - dict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictCreate"
      responses:
        "201":
          description: "创建成功"
      security:
        - bearer: [ ]
    get:
      summary: 字典列表
      operationId: getDicts
      tags:
        - dict
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Dict"
                  meta:
                    $ref: "#/components/schemas/Pagination"
                required:
                  - data
                  - meta
          description: "获取成功"
      security:
        - bearer: [ ]
  /dicts/{id}:
    get:
      summary: 获取字典
      operationId: getDict
      tags:
        - dict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dict"
      security:
        - bearer: [ ]
    put:
      summary: 更新字典
      operationId: updateDict
      tags:
        - dict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictUpdate"
      responses:
        "204":
          description: ""
      security:
        - bearer: [ ]
    delete:
      summary: 删除字典
      operationId: deleteDict
      tags:
        - dict
      parameters:
        - name: id
