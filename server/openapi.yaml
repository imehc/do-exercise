openapi: 3.1.0
info:
  title: xxxx system
  description: ""
  version: 1.0.0

servers:
  - url: http://127.0.0.1:6020
    description: 开发环境

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 通过请求头Authorization传递token进行认证

  schemas:
    ValidationDetail:
      type: object
      properties:
        field:
          type: string
          description: 错误字段名称
        messages:
          type: array
          items:
            type: string
          description: 错误信息列表
      required:
        - field
        - messages

    ValidationError:
      type: object
      properties:
        type:
          type: string
          description: 错误类型
        message:
          type: string
          description: 错误信息
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationDetail"
          description: 详细错误信息
      required:
        - type
        - message

    PublicKey:
      type: object
      properties:
        public_key:
          type: string
          description: RSA公钥
      required:
        - public_key

    Token:
      type: object
      properties:
        access_token:
          type: string
          description: 访问令牌
        expire_time:
          type: integer
          format: int64
          description: 访问令牌过期时间
        refresh_token:
          type: string
          description: 刷新令牌
        refresh_expire_time:
          type: integer
          format: int64
          description: 刷新令牌过期时间
        must_change_password:
          type: boolean
          description: 是否仍需强制修改密码，前端据此跳转改密页
      required:
        - access_token
        - expire_time
        - refresh_token
        - refresh_expire_time
        - must_change_password

    Captcha:
      type: object
      properties:
        captcha_id:
          type: string
          description: 验证码ID
        pic_path:
          type: string
          description: 验证码图片路径
        captcha_length:
          type: string
          description: 验证码长度
      required:
        - captcha_id
        - pic_path
        - captcha_length

    Login:
      type: object
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          description: 密码
        captcha_id:
          type: string
          description: 验证码ID
        captcha:
          type: string
          description: 验证码
        public_key:
          type: string
          description: 公钥
      required:
        - username
        - password
        - captcha_id
        - captcha
        - public_key

    ForgetPassword:
      type: object
      properties:
        email:
          type: string
          description: 邮箱
        code:
          type: string
          description: 验证码
        password:
          type: string
          description: 密码
        public_key:
          type: string
          description: 公钥
      required:
        - email
        - code
        - password
        - public_key

    MenuType:
      type: integer
      description: 菜单类型
      enum:
        - 1
        - 2
        - 3
      x-enum-descriptions:
        - 目录
        - 菜单
        - 页面元素
      x-enum-varnames:
        - directory
        - menu
        - button

    Control:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        created_by:
          type: string
          format: int64
          description: 创建人ID
        updated_by:
          type: string
          format: int64
          description: 更新人ID
      required:
        - created_at
        - updated_at
        - created_by
        - updated_by

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: "当前页码"
        page_size:
          type: integer
          description: "每页数量"
        total:
          type: integer
          description: "总数量"
      required:
        - page
        - page_size
        - total

    Oss:
      type: object
      properties:
        put_object_url:
          type: string
          description: 上传对象URL
        get_object_url:
          type: string
          description: 预签名URL
        expires:
          type: integer
          format: int64
          description: 过期时间戳(秒)
      required:
        - put_object_url
        - get_object_url
        - expires

    TokenInfo:
      type: object
      properties:
        username:
          type: string
          description: 用户名
        user_id:
          type: string
          format: int64
        disabled:
          type: boolean
          description: 是否禁用
        access_token:
          type: string
          description: 访问令牌
        refresh_token:
          type: string
          description: 刷新令牌
        access_token_created:
          type: string
          format: date-time
          description: 令牌创建时间
        access_token_expired:
          type: string
          format: date-time
          description: 令牌到期时间
        refresh_token_created:
          type: string
          format: date-time
          description: 刷新令牌创建时间
        refresh_token_expired:
          type: string
          format: date-time
          description: 刷新令牌到期时间
      required:
        - username
        - user_id
        - disabled
        - access_token
        - refresh_token
        - access_token_created
        - access_token_expired
        - refresh_token_created
        - refresh_token_expired

    DeleteToken:
      type: object
      properties:
        access_token:
          type: string
          description: 令牌
      required:
        - access_token

    ModityTokenStatus:
      allOf:
      - $ref: "#/components/schemas/DeleteToken"
      properties:
        disabled:
          type: boolean
          description: 是否禁用
      required:
        - disabled

    SysOperationLog:
      type: object
      properties:
        id:
          type: integer
          description: 主键ID
        username:
          type: string
          description: 请求用户
        ip:
          type: string
          description: IP地址
        is_internal_ip:
          type: boolean
          description: 是否是内网IP
        address:
          type: string
          description: 地址
        user_agent:
          type: string
          description: UA信息
        browser:
          type: string
          description: 浏览器
        browser_version:
          type: string
          description: 浏览器版本
        is_mobile:
          type: boolean
          description: 是否是手机
        is_bot:
          type: boolean
          description: 是否是机器人
        os:
          type: string
          description: 操作系统
        path:
          type: string
          description: 请求路径
        method:
          type: string
          description: 请求方法
        success:
          type: boolean
          description: 是否成功
        code:
          type: integer
          description: 错误码
        message:
          type: string
          description: 错误信息
        params:
          type: string
          description: 请求参数
        body:
          type: string
          description: 请求体
        result:
          type: string
          description: 响应结果
        start_time:
          type: string
          format: date-time
          description: 请求开始时间
        end_time:
          type: string
          format: date-time
          description: 请求结束时间
        latency:
          type: integer
          format: int64
          description: 耗时(毫秒)
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
      required:
        - id
        - ip
        - is_internal_ip
        - user_agent
        - browser
        - browser_version
        - is_mobile
        - is_bot
        - os
        - path
        - method
        - success
        - code
        - start_time
        - end_time
        - latency
        - created_at
        - updated_at

    SysInfoWithOs:
      type: object
      properties:
        goos:
          type: string
          description: 操作系统
        num_cpu:
          type: integer
          description: CPU数量
        compiler:
          type: string
          description: 编译器
        go_version:
          type: string
          description: Go版本
        num_goroutine:
          type: integer
          description: 协程数量
      required:
        - goos
        - num_cpu
        - compiler
        - go_version
        - num_goroutine

    SysInfoWithCpu:
      type: object
      properties:
        cpus:
          type: array
          description: cpu信息
          items: 
            type: integer
            description: cpu信息
        cores:
          type: integer
          description: cpu核数
      required:
        - cpus
        - cores

    SysInfoWithRam:
      type: object
      properties:
        used:
          type: integer
          description: 已使用内存(MB)
        total:
          type: integer
          description: 总内存(MB)
        used_percent:
          type: integer
          description: 已使用百分比
      required:
        - used
        - total
        - used_percent

    SysInfoWithDisk:
      type: object
      properties:
        mount_point:
          type: string
          description: 磁盘路径
        used:
          type: integer
          description: 已使用内存(MB)
        total:
          type: integer
          description: 总内存(MB)
        use_dpercent:
          type: integer
          description: 已使用内存百分比
      required:
        - mount_point
        - used
        - total
        - use_dpercent

    SysInfo:
      type: object
      properties:
        os:
          $ref: '#/components/schemas/SysInfoWithOs'
          description: 系统信息
        cpu:
          $ref: '#/components/schemas/SysInfoWithCpu'
          description: CPU信息
        ram:
          $ref: '#/components/schemas/SysInfoWithRam'
          description: 内存信息
        disks:
          type: array
          description: 磁盘信息
          items: 
            $ref: '#/components/schemas/SysInfoWithDisk'
      required:
        - os
        - cpu
        - ram
        - disks

    UpdateSysApi:
      type: object
      properties:
        description:
          type: string
          description: 描述
        group:
          type: string
          description: 分组
        disabled:
          type: boolean
          description: 是否禁用
        sort:
          type: integer
          description: 排序

    SysApi:
      type: object
      properties:
        id:
          type: integer
          description: ID
        path:
          type: string
          description: 路径
        description:
          type: string
          description: 描述
        method:
          type: string
          description: 方法
        group:
          type: string
          description: 分组
        disabled:
          type: boolean
          description: 是否禁用
        sort:
          type: integer
          description: 排序
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
      required:
        - id
        - path
        - description
        - method
        - disabled
        - sort
        - created_at
        - updated_at

    CreateSysMenuWithDirectory:
      type: object
      properties:
        parent_id:
          type: integer
          description: 父菜单ID
        type:
          $ref: "#/components/schemas/MenuType"
          description: 菜单类型
        name:
          type: string
          description: 菜单名称
        sort:
          type: integer
          description: 排序
      required:
        - parent_id
        - type
        - name

    CreateSysMenuWithMenu:
      allOf:
        - $ref: "#/components/schemas/CreateSysMenuWithDirectory"
        - type: object
          properties:
            icon:
              type: string
              description: 图标
            route:
              type: string
              description: 路由
            component:
              type: string
              description: 组件
            visible:
              type: boolean
              description: 是否可见
          required:
            - icon
            - route
            - component

    CreateSysMenuWithButton:
      type: object
      properties:
        parent_id:
          type: integer
          description: 父菜单ID
        type:
          $ref: "#/components/schemas/MenuType"
          description: 菜单类型
        name:
          type: string
          description: 菜单名称
        permission:
          type: string
          description: 权限标识
        api_ids:
          type: array
          items:
            type: integer
          description: API ID列表
      required:
        - parent_id
        - type
        - name
        - permission
        - api_ids

    CreateSysMenu:
      anyOf:
        - $ref: "#/components/schemas/CreateSysMenuWithDirectory"
        - $ref: "#/components/schemas/CreateSysMenuWithMenu"
        - $ref: "#/components/schemas/CreateSysMenuWithButton"

    SysMenuWithDirectory:
      allOf:
        - $ref: "#/components/schemas/Control"
        - type: object
          properties:
            id:
              type: integer
              description: ID
            parent_id:
              type: integer
              description: 父菜单ID
            type:
              $ref: "#/components/schemas/MenuType"
              description: 菜单类型
            name:
              type: string
              description: 菜单名称
            icon:
              type: string
              description: 图标
            route:
              type: string
              description: 路由
            sort:
              type: integer
              description: 排序
      required:
        - id
        - parent_id
        - type
        - name
        - route

    SysMenuWithMenu:
      allOf:
        - $ref: "#/components/schemas/SysMenuWithDirectory"
        - type: object
          properties:
            component:
              type: string
              description: 组件
            visible:
              type: boolean
              description: 是否可见
      required:
        - component
        - apis

    SysMenuWithButton:
      allOf:
        - $ref: "#/components/schemas/SysMenuWithDirectory"
        - type: object
          properties:
            id:
              type: integer
              description: ID
            parent_id:
              type: integer
              description: 父菜单ID
            type:
              $ref: "#/components/schemas/MenuType"
              description: 菜单类型
            name:
              type: string
              description: 菜单名称
            permission:
              type: string
              description: 权限标识
            apis:
              type: array
              items:
                $ref: "#/components/schemas/SysApi"
              description: API列表
          required:
            - id
            - parent_id
            - type
            - name
            - permission
            - apis

    SysMenu:
      anyOf:
        - $ref: "#/components/schemas/SysMenuWithDirectory"
        - $ref: "#/components/schemas/SysMenuWithMenu"
        - $ref: "#/components/schemas/SysMenuWithButton"

    SysMenuTree:
      type: object
      properties:
        id:
          type: integer
          description: ID
        name:
          type: string
          description: 菜单名称
        parent_id:
          type: integer
          description: 父菜单ID
        permission:
          type: string
          description: 权限标识
        icon:
          type: string
          description: 图标
        type:
          $ref: "#/components/schemas/MenuType"
          description: 菜单类型
        route:
          type: string
          description: 路由
        component:
          type: string
          description: 组件
        sort:
          type: integer
          description: 排序
        visible:
          type: boolean
          description: 是否可见
        children:
          type: array
          items:
            $ref: "#/components/schemas/SysMenuTree"
          description: 子菜单列表
      required:
        - id
        - name
        - type
        - children

    CreateSysRole:
      type: object
      properties:
        name:
          type: string
          description: 角色名称
        code:
          type: string
          description: 角色编码
        menu_ids:
          type: array
          items:
            type: integer
          description: 菜单ID列表
      required:
        - name
        - code
        - menu_ids

    UpdateSysRole:
      type: object
      properties:
        name:
          type: string
          description: 角色名称
        menu_ids:
          type: array
          items:
            type: integer
          description: 菜单ID列表
      required:
        - name
        - menu_ids

    SysRole:
      allOf:
        - $ref: "#/components/schemas/Control"
        - type: object
          properties:
            id:
              type: integer
              description: ID
            name:
              type: string
              description: 角色名称
            code:
              type: string
              description: 角色编码
            menus:
              type: array
              items:
                title: SystemMenuBrief
                properties:
                  id:
                    type: integer
                    description: ID
                  name:
                    type: string
                    description: 菜单名称
                required:
                  - id
                  - name
              description: 菜单列表
      required:
        - id
        - name
        - code
        - menus
    ResetSysUserPassword:
      type: object
      properties:
        password:
          type: string
          description: 密码
      required:
        - password
    
    CreateSysUser:
      type: object
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          description: 密码
        nickname:
          type: string
          description: 昵称
        email:
          type: string
          description: 邮箱
          format: email
        avatar:
          type: string
          description: 头像
        role_ids:
          type: array
          description: 角色ID列表
          items:
            type: integer
            format: uint
      required:
        - username
        - password
        - role_ids

    UpdateSysUser:
      type: object
      properties:
        nickname:
          type: string
          description: 昵称
        avatar:
          type: string
          description: 头像
        role_ids:
          type: array
          description: 角色ID列表
          items:
            type: integer
            format: uint

    SysUser:
      allOf:
         - $ref: "#/components/schemas/Control"
         - type: object
           properties:
             id:
               type: string
               description: ID
             username:
               type: string
               description: 用户名
             nickname:
               type: string
               description: 昵称
             email:
               type: string
               description: 邮箱
               format: email
             avatar:
               type: string
               description: 头像
             roles:
               type: array
               description: 角色ID列表
               items:
                 title: SystemRoleBrief
                 properties:
                   id:
                     type: integer
                     description: 角色ID
                   code:
                     type: string
                     description: 角色编码
                   name:
                     type: string
                     description: 角色名称
                 required:
                   - id
                   - code
                   - name

      required:
        - id
        - username
        - nickname
        - roles

    BindEmail:
      type: object
      properties:
        email:
          type: string
          description: 邮箱
          format: email
        code:
          type: string
          description: 验证码
      required:
        - email
        - code

    ModifyPassword:
      type: object
      properties:
        old_password:
          type: string
          description: 旧密码
        password:
          type: string
          description: 新密码
        public_key:
          type: string
          description: 公钥
      required:
        - old_password
        - password
        - public_key

    Role:
      type: object
      properties:
        id:
          type: integer
          description: 角色ID
        name:
          type: string
          description: 角色名称
      required:
        - id
        - name

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: int64
          description: 用户ID
        username:
          type: string
          description: 用户名
        nickname:
          type: string
          description: 昵称
        email:
          type: string
          description: 邮箱
          format: email
        avatar:
          type: string
          description: 头像
        roles:
          type: array
          description: 角色信息
          items:
            $ref: "#/components/schemas/Role"
      required:
        - id
        - username
        - roles

    UpdateUserProfile:
      type: object
      properties:
        nickname:
          type: string
          description: 昵称
        avatar:
          type: string
          description: 头像

    Menu:
      type: object
      properties:
        id:
          type: integer
          description: 菜单ID
        name:
          type: string
          description: 菜单名称
        parent_id:
          type: integer
          description: 父菜单ID
        permission:
          type: string
          description: 权限标识
        icon:
          type: string
          description: 图标
        type:
          $ref: "#/components/schemas/MenuType"
          description: 菜单类型
        route:
          type: string
          description: 路由
        component:
          type: string
          description: 组件
      required:
        - id
        - name
        - parent_id
        - type

    JobStatus:
      type: integer
      description: 状态
      enum:
        - 1
        - 2
      x-enum-descriptions:
        - 正常
        - 暂停
      x-enum-varnames:
        - normal
        - paused

    SysJob:
      type: object
      properties:
        id:
          type: integer
          description: 任务ID
        name:
          type: string
          description: 任务名称
        job_group:
          type: string
          description: 任务分组
        cron_expression:
          type: string
          description: cron表达式
        command:
          type: string
          description: 执行命令
        status:
          $ref: '#/components/schemas/JobStatus'
        concurrent:
          type: boolean
          description: 是否并发执行
        description:
          type: string
          description: 任务描述
        last_time:
          type: string
          format: date-time
          description: 上次执行时间
        next_time:
          type: string
          format: date-time
          description: 下次执行时间
        times:
          type: integer
          description: 执行次数
        retry_times:
          type: integer
          description: 重试次数
        retry_interval:
          type: integer
          description: 重试间隔(秒)
        timeout:
          type: integer
          description: 执行超时时间(秒)
        created_at:
          type: string
          format: date-time
          description: 创建时间
        created_by:
          type: string
          description: 创建人
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        updated_by:
          type: string
          description: 更新人
      required:
        - id
        - name
        - job_group
        - cron_expression
        - command
        - status
        - concurrent
        - created_at
        - created_by
        - updated_at
        - updated_by

    CreateSysJob:
      type: object
      properties:
        name:
          type: string
          description: 任务名称
        job_group:
          type: string
          description: 任务分组
        cron_expression:
          type: string
          description: cron表达式
        command:
          type: string
          description: 执行命令
        status:
          $ref: '#/components/schemas/JobStatus'
        concurrent:
          type: boolean
          description: 是否并发执行
        description:
          type: string
          description: 任务描述
        retry_times:
          type: integer
          description: 重试次数
        retry_interval:
          type: integer
          description: 重试间隔(秒)
        timeout:
          type: integer
          description: 执行超时时间(秒)
      required:
        - name
        - job_group
        - cron_expression
        - command
        - status

    UpdateSysJob:
      allOf:
